name: Build Sultan Pharma Final Sovereign APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Self-Contained Android Initialization & Build
        run: |
          echo "=== [Sovereign Final Mode] Ensuring complete Android scaffolding ==="
          
          # التأكد من وجود ملف pubspec.yaml
          if [ ! -f "pubspec.yaml" ]; then
            echo "Error: pubspec.yaml is missing!"
            exit 1
          fi

          # إذا كان مجلد أندرويد غير موجود في المستودع، نقوم بتوليده آلياً وبشكل نظيف لضمان اكتمال البيئة
          if [ ! -d "android" ]; then
            echo "Android directory missing from repo. Generating clean scaffolding..."
            flutter create . --org com.sultan.pharma --project-name sultan_pharma_sovereign --platforms=android
          fi

          # ضبط ملف build.gradle وحقن الـ namespace بدقة مطلقة
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            if ! grep -q "namespace" "$BUILD_GRADLE"; then
              echo "Injecting namespace into build.gradle..."
              sed -i 's/defaultConfig {/defaultConfig {\n        namespace "com.sultan.pharma.sultan_pharma_sovereign"/g' "$BUILD_GRADLE"
            fi
          fi

          # ضبط أذونات وصيغة الـ Gradle Wrapper
          cd android
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi
          ./gradlew wrapper --gradle-version 8.5
          cd ..

          # جلب التبعيات وبناء الـ Debug APK بطريقة مستقرة ومضمونة
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons

      - name: Upload Final Sovereign APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Pharma-Final-Debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          

