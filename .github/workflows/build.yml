name: Build Sultan Pharma Sovereign Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Execute Proven Sovereign Build Pipeline
        run: |
          # 1. التحقق من هيكل الأندرويد أو توليده نظيفاً
          if [ ! -f "pubspec.yaml" ]; then
            echo "Error: pubspec.yaml missing in root!"
            exit 1
          fi

          if [ ! -d "android" ]; then
            flutter create . --org com.sultan.pharma --project-name sultan_pharma_sovereign --platforms=android
          fi

          # 2. ضمان وجود الـ namespace في ملف build.gradle
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            if ! grep -q "namespace" "$BUILD_GRADLE"; then
              sed -i 's/defaultConfig {/defaultConfig {\n        namespace "com.sultan.pharma.sultan_pharma_sovereign"/g' "$BUILD_GRADLE"
            fi
          fi

          # 3. إعطاء أذونات التنفيذ لملف الـ gradlew لمنع مشاكل الأذونات
          cd android
          chmod +x gradlew
          ./gradlew wrapper --gradle-version 8.5
          cd ..

          # 4. جلب التبعيات وبناء حزمة APK (تم اعتماد وضع التشغيل المضمون لتجنب تعقيدات التوقيع السحابي)
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons

      - name: Upload Sovereign APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Pharma-Sovereign-Debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          
