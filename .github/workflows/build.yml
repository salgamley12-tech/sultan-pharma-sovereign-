name: Build Sultan Pharma Sovereign Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Execute Sovereign Expert Build Pipeline
        run: |
          # 1. إنشاء بيئة فلاتر معزولة ونظيفة تماماً
          flutter create sovereign_build --org com.sultan.pharma --project-name sultan_pharma_sovereign --platforms=android
          
          # 2. حقن الملفات البرمجية والتبعيات الخاصة بك
          rm -rf sovereign_build/lib
          cp -r lib sovereign_build/lib
          cp pubspec.yaml sovereign_build/pubspec.yaml
          
          # 3. الانتقال للبيئة وضبط إعدادات الغريدل والـ Namespace تفادياً لأخطاء AGP 8
          cd sovereign_build
          
          # حقن التعديلات الحتمية في ملف بناء الأندرويد لضمان استقرار الغريدل
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            echo "Injecting namespace and sovereign signing config..."
            # التأكد من وجود الـ namespace
            sed -i 's/defaultConfig {/defaultConfig {\n        namespace "com.sultan.pharma.sultan_pharma_sovereign"/g' "$BUILD_GRADLE"
          fi

          flutter pub get
          
          # ترقية الغريدل للتوافق مع بيئة البناء الحديثة
          cd android
          ./gradlew wrapper --gradle-version 8.5
          cd ..
          
          # 4. بناء رزمة الـ APK مع تفعيل وضع التفصيل الكامل لضمان خلوه من الأخطاء
          flutter build apk --release --no-tree-shake-icons --verbose

      - name: Upload Sovereign APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Pharma-Sovereign-Release
          path: sovereign_build/build/app/outputs/flutter-apk/app-release.apk
          
