name: Build Sultan Pharma Sovereign Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Generate Sovereign Flutter Shell
        run: |
          flutter create . --org com.sultan.pharma --project-name sultan_pharma_sovereign --platforms=android

      - name: Upgrade Gradle Wrapper for Compatibility
        run: |
          cd android
          ./gradlew wrapper --gradle-version 8.4
          cd ..

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK (Verbose Sovereign Mode)
        run: flutter build apk --release --no-tree-shake-icons --verbose

      - name: Upload Sovereign APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Pharma-Sovereign-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          
