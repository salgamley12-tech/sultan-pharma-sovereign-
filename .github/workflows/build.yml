name: Build Sultan Pharma Sovereign Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Build via Isolated Sovereign Shell
        run: |
          # 1. إنشاء مشروع فلاتر نظيف ومعزول تماماً في مسار مؤقت
          flutter create sovereign_build --org com.sultan.pharma --platforms=android
          
          # 2. حقق ملفاتك وخصائصك البرمجية إلى البيئة النظيفة
          rm -rf sovereign_build/lib
          cp -r lib sovereign_build/lib
          cp pubspec.yaml sovereign_build/pubspec.yaml
          
          # 3. الانتقال إلى البيئة المعزولة وبناء حزمة الـ Release APK
          cd sovereign_build
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Sovereign APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Pharma-Sovereign-Release
          path: sovereign_build/build/app/outputs/flutter-apk/app-release.apk
          
