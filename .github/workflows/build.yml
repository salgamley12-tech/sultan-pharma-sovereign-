name: Build Sultan Pharma Sovereign Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Initialize Sovereign Project Structure
        run: |
          # التحقق من وجود الهيكل أو توليده مباشرة في الجذر إذا كان ناقصاً
          if [ ! -d "android" ]; then
            flutter create . --org com.sultan.pharma --project-name sultan_pharma_sovereign --platforms=android
          fi

      - name: Configure Gradle Wrapper
        run: |
          cd android
          ./gradlew wrapper --gradle-version 8.5
          cd ..

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Sovereign Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Sovereign APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Pharma-Sovereign-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          
