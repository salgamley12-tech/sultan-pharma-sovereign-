name: Build Sultan Pharma Sovereign Standard APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Standard Sovereign Initialization & Build
        run: |
          # 1. تنظيف وتوليد الهيكل القياسي إذا لم يكن موجوداً
          if [ ! -d "android" ]; then
            flutter create . --org com.sultan.pharma --project-name sultan_pharma_sovereign --platforms=android
          fi

          # 2. ضمان وجود الـ namespace المطلوبة لـ AGP الحديث
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            if ! grep -q "namespace" "$BUILD_GRADLE"; then
              sed -i 's/defaultConfig {/defaultConfig {\n        namespace "com.sultan.pharma.sultan_pharma_sovereign"/g' "$BUILD_GRADLE"
            fi
          fi

          # 3. ضبط أذونات وصيغة الـ Gradle Wrapper
          cd android
          chmod +x gradlew
          ./gradlew wrapper --gradle-version 8.5
          cd ..

          # 4. جلب التبعيات وبناء الـ Debug APK بطريقة مستقرة ومضمونة
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons

      - name: Upload Standard Sovereign Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Pharma-Standard-Debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          
