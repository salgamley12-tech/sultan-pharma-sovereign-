name: Build Sultan Pharma Pure Repository APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Build From Existing Repository Files Only
        run: |
          echo "=== [Sovereign Mode] Using existing repository structure exclusively ==="
          
          # التحقق من وجود ملف الـ pubspec.yaml في المستودع الفعلي
          if [ ! -f "pubspec.yaml" ]; then
            echo "Error: pubspec.yaml is missing from the repository root!"
            exit 1
          fi

          # التحقق من وجود مجلد android مسبقاً وتعديله إن وجد، أو إيقاف العملية إذا تطلب الأمر
          if [ -d "android" ]; then
            echo "Android directory found in repository. Securing configurations..."
            
            # حقن الـ namespace آلياً إن لم يكن موجوداً في ملف build.gradle الفعلي
            BUILD_GRADLE="android/app/build.gradle"
            if [ -f "$BUILD_GRADLE" ]; then
              if ! grep -q "namespace" "$BUILD_GRADLE"; then
                echo "Injecting namespace into existing build.gradle..."
                sed -i 's/defaultConfig {/defaultConfig {\n        namespace "com.sultan.pharma.sultan_pharma_sovereign"/g' "$BUILD_GRADLE"
              fi
            fi

            # منح أذونات التنفيذ لملف الـ gradlew الموجود في المستودع
            cd android
            if [ -f "gradlew" ]; then
              chmod +x gradlew
            fi
            ./gradlew wrapper --gradle-version 8.5
            cd ..
          else
            echo "Error: The 'android' directory does not exist in the repository. Please ensure android scaffolding is tracked or committed."
            exit 1
          fi

          # جلب التبعيات وبناء الـ Debug APK حصرياً من الملفات الحالية
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons

      - name: Upload Pure Repository APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Pharma-Pure-Repo-Debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          
