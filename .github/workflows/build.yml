name: Build Sultan Pharma Sovereign Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Execute Verified Sovereign Build Pipeline
        run: |
          # 1. إنشاء هيكل فلاتر النظيف في الجذر
          flutter create . --org com.sultan.pharma --project-name sultan_pharma_sovereign --platforms=android

          # 2. حقق وترقية إعدادات الـ build.gradle لحل أزمة التوقيع والـ namespace نهائياً
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            echo "Injecting namespace and release-debug signing bypass..."
            
            # التأكد من وجود الـ namespace
            if ! grep -q "namespace" "$BUILD_GRADLE"; then
              sed -i 's/defaultConfig {/defaultConfig {\n        namespace "com.sultan.pharma.sultan_pharma_sovereign"/g' "$BUILD_GRADLE"
            fi
            
            # ضبط توقيع الـ release ليستخدم مفتاح الـ debug لتجاوز خطأ التوقيع الإجباري
            if ! grep -q "signingConfig signingConfigs.debug" "$BUILD_GRADLE"; then
              sed -i '/buildTypes {/,/}/ {
                /release {/ {
                  n
                  a \            signingConfig signingConfigs.debug
                }
              }' "$BUILD_GRADLE"
            fi
          fi

          # 3. تحديث الـ Gradle Wrapper إلى نسخة 8.5 المتوافقة
          cd android
          ./gradlew wrapper --gradle-version 8.5
          cd ..

          # 4. جلب التبعيات وبناء الـ APK بنجاح
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Sovereign APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Pharma-Sovereign-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          
